# Server
server.port=8082
server.servlet.context-path=/api
# Jpa settings
spring.jpa.hibernate.ddl-auto=update
# Datasource
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Security
oauth.jwt.secret=OvoJeNekaVeomaDugackaSifraKojaImaViseOdSezdesetCetiriKarakteraDaBiHS512RadioKakoTreba1234567890
# ActiveMQ
amq.url=tcp://localhost:61616
amq.queryParameters=?jms.prefetchPolicy.all=1&jms.redeliveryPolicy.maximumRedeliveries=0
spring.activemq.broker-url=${amq.url}${amq.queryParameters}
destination.incrementReservationCount=increment_reservation_count
# Ovo govori Jacksonu da ne razbija datum na niz/objekat, vec da salje kao ISO String
spring.jackson.serialization.write-dates-as-timestamps=false